<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Malwa Diagnostic Imaging – RIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f2f4f8;
}
header{
    position:relative;
    background:radial-gradient(circle at top,#1e3a8a,#020617);
    color:#fff;
    padding:36px 24px 42px;
    text-align:center;
    perspective:900px;
    overflow:hidden;
}
.telerad-globe{
    position:absolute;
    right:30px;
    bottom:-10px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#93c5fd,#1d4ed8,#020617);
    box-shadow:
        0 0 25px rgba(59,130,246,0.6),
        inset 0 0 25px rgba(255,255,255,0.3);
    animation:spinGlobe 12s linear infinite;
}
@keyframes spinGlobe{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}
.corner-img{
    position:absolute;
    top:16px;
    width:64px;
    opacity:0.85;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.6));
}
.corner-img.left{left:20px}
.corner-img.right{right:20px}
.malwa-title{
    font-size:78px;
    font-weight:900;
    letter-spacing:10px;
    text-transform:uppercase;
    background:linear-gradient(120deg,#fff8cc,#ffd700,#ffffff,#ffd700,#ffcc33);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.malwa-sub{
    margin-top:10px;
    font-size:24px;
    font-weight:600;
    letter-spacing:3px;
    color:#e0e7ff;
}
.container{padding:20px}
.card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}
label{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
}
input,select,button{
    padding:10px;
    border-radius:10px;
    border:1px solid #cbd5e1;
}
button{cursor:pointer;font-weight:600}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
#editor{
    min-height:520px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:18px;
}
.list{
    max-height:200px;
    overflow:auto;
    border:1px solid #e5e7eb;
    border-radius:6px;
}
.list div{
    padding:8px;
    cursor:pointer;
    border-bottom:1px solid #e5e7eb;
}
footer{
    text-align:center;
    padding:10px;
    font-size:12px;
    color:#64748b;
}
</style>
</head>

<body>

<header>
    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966481.png" class="corner-img left">
    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966495.png" class="corner-img right">
    <div class="malwa-title">MALWA</div>
    <div class="malwa-sub">Diagnostic Imaging • RIS</div>
    <div class="telerad-globe"></div>
</header>

<div class="container">

<div class="card">
<h3>Patient Details</h3>
<div class="grid">
    <input id="patient_name" placeholder="Patient Name">
    <input id="uhid" placeholder="UHID">
    <input id="age_sex" placeholder="Age / Sex">
    <input type="date" id="date">
    <select id="modality" onchange="loadTemplates()">
        <option value="CT">CT</option>
        <option value="MRI">MRI</option>
        <option value="USG">USG</option>
        <option value="XRAY">X-Ray</option>
    </select>
    <select id="templateDropdown" onchange="selectTemplateFromDropdown()">
        <option value="">Select Template</option>
    </select>
</div>
</div>

<div class="card">
<h3>Report Editor</h3>
<div id="editor" contenteditable="true"></div>
<div class="grid" style="margin-top:10px">
    <button class="btn-success" onclick="saveReport()">Save</button>
    <button class="btn-danger" onclick="clearEditor()">Clear</button>
</div>
</div>

<div class="card">
<h3>Saved Reports</h3>
<div class="grid">
    <input id="search_patient" placeholder="Patient name">
    <input id="search_uhid" placeholder="UHID">
    <input type="date" id="search_date">
    <button class="btn-primary" onclick="searchReports()">Search</button>
</div>
<div class="list" id="reportList"></div>
</div>

</div>

<footer>Malwa RIS • GitHub Pages</footer>

<script>
/* ✅ FIXED: PUBLIC BACKEND URL */
const API = "https://malwa-ris-backend.onrender.com";

async function loadTemplates(){
    const m = modality.value;
    templateDropdown.innerHTML = "<option>Loading...</option>";
    const r = await fetch(`${API}/api/templates/${m}`);
    const data = await r.json();
    templateDropdown.innerHTML = "<option value=''>Select Template</option>";
    data.forEach(t=>{
        templateDropdown.innerHTML += `<option value="${t.id}">${t.name}</option>`;
    });
}

async function selectTemplateFromDropdown(){
    if(!templateDropdown.value) return;
    const r = await fetch(`${API}/api/load_template`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({file_id:templateDropdown.value})
    });
    const d = await r.json();
    editor.innerHTML = d.html;
}

async function saveReport(){
    await fetch(`${API}/api/save_report`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            patient_name:patient_name.value,
            uhid:uhid.value,
            date:date.value,
            modality:modality.value,
            html:editor.innerHTML
        })
    });
    alert("Saved to Drive");
}

async function searchReports(){
    const r = await fetch(`${API}/api/reports?patient_name=${search_patient.value}&uhid=${search_uhid.value}&date=${search_date.value}`);
    const list = await r.json();
    reportList.innerHTML="";
    list.forEach(x=>{
        const d=document.createElement("div");
        d.textContent=`${x.patient_name} | ${x.modality} | ${x.date}`;
        d.onclick=()=>window.open(`${API}/api/download_word/${x.id}`);
        reportList.appendChild(d);
    });
}

function clearEditor(){ editor.innerHTML=""; }
</script>

</body>
</html>
